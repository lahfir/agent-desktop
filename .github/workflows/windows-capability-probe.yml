name: Windows capability probe

# Measure-before-design evidence for the Windows adapter sub-phases. The
# trigger is pull_request, not only workflow_dispatch: GitHub dispatches a
# workflow only when the file exists on the default branch, and every Windows
# sub-phase lands on feat/windows-adapter rather than on main, so a dispatch
# trigger alone would never run on the branch that needs the measurement. The
# path filter keeps this job off every unrelated pull request.
on:
  pull_request:
    paths:
      - 'probes/windows/14-ci-capability/**'
      - 'probes/windows/15-vocabulary/**'
      - 'probes/windows/16-observation/**'
      - 'probes/windows/17-resolution/**'
      - 'probes/windows/18-actionability/**'
      - '.github/workflows/windows-capability-probe.yml'
  workflow_dispatch:

concurrency:
  group: windows-capability-probe-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  capability-probe:
    name: Measure the hosted Windows runner
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Rust toolchain
        run: rustup show

      # Windows PowerShell 5.1, matching the rest of the probe corpus; pwsh is
      # not used anywhere in probes/windows.
      - name: Run the capability probe
        shell: powershell
        run: |
          .\probes\windows\14-ci-capability\probe.ps1 -Label ci

      - name: Run the vocabulary probe
        shell: powershell
        run: |
          .\probes\windows\15-vocabulary\probe.ps1 -Label ci

      - name: Run the observation probe
        shell: powershell
        run: |
          .\probes\windows\16-observation\probe.ps1 -Label ci -SkipChromium

      - name: Run the resolution probe
        shell: powershell
        run: |
          .\probes\windows\17-resolution\probe.ps1 -Label ci -SkipChromium

      - name: Run the actionability probe
        shell: powershell
        run: |
          .\probes\windows\18-actionability\probe.ps1 -Label ci -SkipChromium

      # Uploads on failure as well as success. A probe that fails its mandatory
      # measurement gate has already written the placeholder captures naming
      # what did not measure, and on a red run those are the entire evidence
      # trail - skipping the upload would leave a debugger with an exit code and
      # nothing else. !cancelled() rather than always(): the concurrency group
      # above supersedes runs routinely, always() keeps running through a
      # cancellation and is the documented cause of runs that will not cancel.
      - name: Upload the measured captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-capability-probe-captures
          path: |
            probes/windows/14-ci-capability/captures/*-ci.json
            probes/windows/15-vocabulary/captures/*-ci.json
            probes/windows/16-observation/captures/*-ci.json
            probes/windows/17-resolution/captures/*-ci.json
            probes/windows/18-actionability/captures/*-ci.json
          # warn, not error. A probe that fails before writing anything leaves
          # nothing to match, and erroring would stack a second "No files were
          # found" failure on top of the real one and read as the cause. What
          # asserts that a run measured something is the mandatory measurement
          # gate inside each probe, which names the missing or degraded capture
          # instead of firing only when every capture in the job is absent.
          if-no-files-found: warn

name: Windows native E2E

# workflow_dispatch plus a push trigger scoped to feat/windows-adapter -
# never pull_request. GitHub only offers a workflow_dispatch run for a
# workflow file present on the default branch, and every Windows sub-phase
# lands on feat/windows-adapter rather than on main (the same mechanic
# windows-capability-probe.yml's own header comment documents), so dispatch
# alone would never be reachable during development. A push trigger fires at
# the pushed ref and cannot be triggered by a fork, so it closes that gap
# without opening pull_request's fork-PR exposure - the exposure a public
# self-hosted runner must never carry. See
# docs/runbooks/windows-self-hosted-runner.md for the full trigger-policy
# rationale, the fork-PR approval setting, and the ephemeral-versus-
# persistent decision. No runner is registered against these labels in this
# PR (deferral item 6) - the workflow and its hardening ship written down and
# reviewable; a push today queues a job nobody claims.
on:
  workflow_dispatch:
  push:
    branches: [feat/windows-adapter]
    paths:
      - 'crates/windows/**'
      - 'crates/core/**'
      - 'src/**'
      - 'tests/e2e-windows/**'
      - 'tests/fixture-app-windows/**'
      - 'scripts/run-windows-e2e-ci.ps1'
      - 'scripts/check-capture-redaction.ps1'
      - '.github/workflows/windows-e2e.yml'

concurrency:
  group: agent-desktop-windows-e2e
  cancel-in-progress: false

permissions: {}

jobs:
  windows-e2e:
    name: Native Windows E2E
    runs-on: [self-hosted, Windows, agent-desktop-e2e]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AGENT_DESKTOP_NATIVE_E2E_RUNNER: "1"
      AGENT_DESKTOP_E2E_CAPTURE_DIR: ${{ github.workspace }}\.e2e-captures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: powershell
        run: rustup show

      - name: Build and run the exclusive native suite
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-windows-e2e-ci.ps1

      # Gated, and gated before the upload runs: this step must run even
      # when the suite leg above failed - a red run's captures are the
      # debugging payload, not a bonus - but the upload below only fires
      # when this step's own outcome is success, never merely job-not-
      # cancelled. This is the one path around R21's committed-capture
      # scope (U15): a live run against real applications produces captures
      # that are never committed, only published as a workflow-run artifact
      # any reader of a public repository can download.
      - name: Redact and gate the run's captures
        id: redaction-gate
        if: ${{ !cancelled() }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-capture-redaction.ps1 -Path "$env:AGENT_DESKTOP_E2E_CAPTURE_DIR"

      # Only the text captures the gate above can read are named here - no
      # screenshot or other binary the gate cannot inspect ever reaches
      # upload-artifact.
      - name: Upload the run's redacted captures
        if: ${{ !cancelled() && steps.redaction-gate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-captures
          path: ${{ env.AGENT_DESKTOP_E2E_CAPTURE_DIR }}/**/*.json
          if-no-files-found: warn

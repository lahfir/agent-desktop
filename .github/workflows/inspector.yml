name: Inspector and visual viewer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Inspector contract and lifecycle tests
        run: npm --prefix tools/inspector test
      - name: Embedded visual viewer tests
        run: node --test src/visual_debug/viewer_filter.test.js

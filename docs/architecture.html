<text x="72" y="206" font-size="29">The agent calls the CLI or C library. agent-desktop reads and operates the app through OS APIs.</text>

<text x="265" y="665" text-anchor="middle" font-size="24">Chooses commands and actions.</text><text x="800" y="665" text-anchor="middle" font-size="24">CLI · C library · FFI</text><text x="1335" y="665" text-anchor="middle" font-size="24">OS accessibility APIs</text>

<g>
<text x="72" y="766" font-size="27" font-weight="800">1. Request a snapshot</text>
<text x="72" y="804" font-size="23">The agent asks for the app’s UI.</text>
<text x="72" y="837" font-size="23">Read the full UI, or start with a</text>
<text x="72" y="870" font-size="23">skeleton overview and drill in.</text>
<text x="447" y="766" font-size="27" font-weight="800">2. Read the native tree</text>
<text x="447" y="804" font-size="23">agent-desktop queries the OS.</text>
<text x="447" y="837" font-size="23">On macOS: AXUIElement.</text>
<text x="447" y="870" font-size="23">Returns roles, states and actions.</text>
<text x="822" y="766" font-size="27" font-weight="800">3. Return JSON + refs</text>
<text x="822" y="804" font-size="23">Actionable or drillable nodes get</text>
<text x="822" y="837" font-size="23">refs scoped to that snapshot.</text>
<text x="822" y="870" font-size="23">Example: @s8f3k2p9:e7</text>
<text x="1197" y="766" font-size="27" font-weight="800">4. Act and verify</text>
<text x="1197" y="804" font-size="23">click @s8f3k2p9:e7</text>
<text x="1197" y="837" font-size="23">Re-identify the control, then act.</text>
<text x="1197" y="870" font-size="23">Read again to verify the change.</text>
</g>
<text x="72" y="927" font-size="23">Headless by default: semantic actions without moving the cursor or stealing focus.</text>
<text x="72" y="974" font-size="22">Refs can go stale when the UI changes. Refresh the affected region before continuing.</text>
<text x="1528" y="974" text-anchor="end" font-size="22">macOS active · Windows + Linux planned</text>
